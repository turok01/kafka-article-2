[versions]
spring-boot = "4.1.1"

[libraries]
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
ch-qos-logback-logback-classic = { module = "ch.qos.logback:logback-classic" }
org-postgresql-postgresql = { module = "org.postgresql:postgresql" }
org-projectlombok-lombok = { module = "org.projectlombok:lombok" }
org-springframework-boot-spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
org-springframework-boot-spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
org-springframework-boot-spring-boot-starter-kafka-test = { module = "org.springframework.boot:spring-boot-starter-kafka-test" }
org-springframework-boot-spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
org-springframework-boot-spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
