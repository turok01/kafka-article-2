# Core settings
spring.application.name=inventory-service
server.port=8081

# Kafka properties
spring.kafka.bootstrap-servers=localhost:29092,localhost:39092,localhost:49092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.group-id=inventoryService
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.igor.kafka_dto_contracts.order.event
# Manual commit + RECORD
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Database connection properties
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Run schema.sql and data.sql on startup
spring.sql.init.mode=always

# If using JPA, let SQL scripts manage the tables
spring.jpa.hibernate.ddl-auto=none

#Producer idempotence
#all - default for Kafka >3.0
spring.kafka.producer.ack=all
#true - default for Kafka >3.0
spring.kafka.producer.properties.enable.idempotence=true
max.in.flight.requests.per.connection=5
spring.kafka.producer.retries=2147483647

logging.level.org.springframework.jdbc.datasource.init=DEBUG

spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql